name: Phase 2S frozen-artifact depth mechanism diagnostic (NO TRAINING)

on:
  push:
    branches:
      - "research/phase2s-*"
    paths:
      - "src/adversarial_sbox/phase2s_retro.py"
      - "tests/test_phase2s_retro.py"
      - "research/PHASE2S_DEPTH_MECHANISM_RETROSPECTIVE.md"
      - ".github/workflows/phase2s-retro.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen-retro:
    name: Research-only Python matrix
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install research test dependencies only
        run: python -m pip install -e ".[dev]"
      - name: Execute artifact-only, zero-training regression tests
        run: python -m pytest -q tests/test_phase2s_retro.py
      - name: Export deterministic posthoc diagnostic (no neural training)
        if: matrix.python-version == '3.11'
        run: |
          python -m adversarial_sbox.phase2s_retro > phase2s_diagnostic.json
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('phase2s_diagnostic.json').read_text())
          assert data["new_training_count"] == 0
          assert data["frozen_verdict_changed"] is False
          assert data["candidate_count"] == 6
          assert data["inference"] == "DESCRIPTIVE_ONLY_N6_NO_CAUSAL_OR_SECURITY_CLAIM"
          print("AUDIT_ONLY; n=6; 0 new neural trainings")
          PY
      - name: Archive transparent descriptive receipt
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: phase2s-retrospective-no-training
          path: phase2s_diagnostic.json
          retention-days: 30
