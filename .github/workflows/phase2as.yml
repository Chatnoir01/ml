name: Phase 2A-S Depth Attenuation

on:
  push:
    branches:
      - research/phase2as-depth-attenuation
    paths:
      - research/PHASE2AS_EXECUTE.md

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install neural package
        run: python -m pip install -e '.[neural]'
      - name: Verify frozen Phase 2A-S lock
        run: |
          python - <<'PY'
          from pathlib import Path
          from adversarial_sbox.phase2as import (
              ARCHITECTURE, DATASET_SEEDS, DEPTHS, DIFFERENCES,
              H5_H4_MAX_RATIO, MODEL_SEEDS, PANEL_DIGEST_SHA256,
              PAIRED_REPLICATES, PERMUTATION_REPETITIONS,
              PERMUTATION_SEEDS, R5_R4_MAX_RATIO, TOTAL_TRAININGS,
          )
          from adversarial_sbox.phase2as_runner import expected_cell_keys, load_frozen_panel

          marker = Path('research/PHASE2AS_EXECUTE.md').read_text()
          assert 'AUTHORIZED_PHASE2AS_DEPTH_ATTENUATION' in marker
          phase2ar = Path('research/PHASE2AR_RESULT.md').read_text()
          assert 'phase2ar_inconclusive_signal' in phase2ar
          assert ARCHITECTURE == 'byte_tanh_mlp'
          assert DEPTHS == (3, 4, 5)
          assert DIFFERENCES == (0x00000001, 0x00000100)
          assert PANEL_DIGEST_SHA256 == '35898535a0df0cfe64431e5f0b6142115d40e3dbeed4a973faa9ba70b1028a30'
          assert len(load_frozen_panel()) == 6
          assert DATASET_SEEDS == (72001, 72019, 72031, 72043, 72053, 72071, 72089, 72101)
          assert MODEL_SEEDS == (82003, 82013, 82021, 82037, 82051, 82067, 82073, 82087)
          assert PAIRED_REPLICATES == 8
          assert PERMUTATION_REPETITIONS == 10000
          assert PERMUTATION_SEEDS == {3: 92003, 4: 92009, 5: 92021}
          assert H5_H4_MAX_RATIO == 0.50
          assert R5_R4_MAX_RATIO == 0.75
          assert TOTAL_TRAININGS == 288
          assert len(expected_cell_keys()) == 6
          print('PHASE2AS_PREFLIGHT_GREEN')
          PY
      - name: Record scientific SHA
        run: echo "PHASE2AS_SCIENTIFIC_SHA=${GITHUB_SHA}"

  cell:
    needs: preflight
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { depth: 3, difference: '0x00000001', label: 'r3-d1' }
          - { depth: 3, difference: '0x00000100', label: 'r3-d100' }
          - { depth: 4, difference: '0x00000001', label: 'r4-d1' }
          - { depth: 4, difference: '0x00000100', label: 'r4-d100' }
          - { depth: 5, difference: '0x00000001', label: 'r5-d1' }
          - { depth: 5, difference: '0x00000100', label: 'r5-d100' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install neural package
        run: python -m pip install -e '.[neural]'
      - name: Run frozen 48-training depth cell
        run: |
          python scripts/run_phase2as.py \
            --depth '${{ matrix.depth }}' \
            --difference '${{ matrix.difference }}' \
            --output 'phase2as-${{ matrix.label }}.json'
      - name: Show compact cell receipt
        run: |
          python - <<'PY'
          import glob, json
          path = glob.glob('phase2as-*.json')[0]
          data = json.load(open(path))
          print('DEPTH:', data['depth'])
          print('ARCHITECTURE:', data['architecture'])
          print('DIFFERENCE:', hex(data['input_difference']))
          print('TRAININGS:', len(data['runs']))
          print('PAYLOAD_SHA256:', data['scientific_payload_sha256'])
          print('NEURAL_EVOLUTIONARY_PRESSURE:', data['neural_evolutionary_pressure'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: phase2as-cell-${{ matrix.label }}-${{ github.sha }}
          path: phase2as-${{ matrix.label }}.json
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: cell
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install neural package
        run: python -m pip install -e '.[neural]'
      - uses: actions/download-artifact@v4
        with:
          pattern: phase2as-cell-*-${{ github.sha }}
          path: cells
          merge-multiple: true
      - name: Aggregate frozen depth diagnostic twice
        run: |
          python scripts/run_phase2as.py --aggregate-files cells/phase2as-*.json --output phase2as-result-1.json
          python scripts/run_phase2as.py --aggregate-files cells/phase2as-*.json --output phase2as-result-2.json
          cmp phase2as-result-1.json phase2as-result-2.json
          cp phase2as-result-1.json phase2as-result.json
      - name: Show official Phase 2A-S classification
        run: |
          python - <<'PY'
          import json
          data = json.load(open('phase2as-result.json'))
          print('TOTAL_TRAININGS:', data['total_trainings'])
          print('PREREQUISITES_PASS:', data['prerequisites_pass'])
          print('ADJACENT_SPEARMAN:', json.dumps(data['adjacent_spearman'], sort_keys=True))
          print('HETEROGENEITY:', json.dumps(data['heterogeneity_by_depth'], sort_keys=True))
          print('RANGES:', json.dumps(data['range_by_depth'], sort_keys=True))
          print('RATIOS:', json.dumps(data['attenuation_ratios'], sort_keys=True))
          print('CRITERIA:', json.dumps(data['attenuation_criteria'], sort_keys=True))
          for depth, summary in data['depth_summaries'].items():
              print('DEPTH', depth, 'p=', summary['heterogeneity_permutation_p'], 'range=', summary['candidate_score_range'], 'signal=', summary['signal_condition'])
          print('VERDICT:', data['verdict'])
          print('AGGREGATE_SHA256:', data['aggregate_payload_sha256'])
          print('NEURAL_EVOLUTIONARY_PRESSURE:', data['neural_evolutionary_pressure'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: phase2as-summary-${{ github.sha }}
          path: phase2as-result.json
          if-no-files-found: error
          retention-days: 90
