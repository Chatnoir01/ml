name: TPM Mutual Learning Laboratory (NO KEY EXCHANGE)

on:
  pull_request:
    paths:
      - "src/tpm_lab/**"
      - "tests/test_tpm_lab.py"
      - "scripts/run_tpm_lab.py"
      - "research/TPM_MUTUAL_LEARNING_V1_PROTOCOL.md"
      - ".github/workflows/tpm-mutual-learning.yml"
  workflow_dispatch:

permissions:
  contents: read

# Cancel only superseded engineering CI; never any scientific experiment.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test tools (no ML/crypto dependency needed)
        run: python -m pip install -e ".[dev]"
      - name: Deterministic synchronization and passive-attacker tests
        run: python -m pytest -q tests/test_tpm_lab.py
      - name: Short lab smoke (non-security research only)
        run: python scripts/run_tpm_lab.py --smoke
