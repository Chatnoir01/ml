name: Phase 0 CI

on:
  push:
    branches:
      - main
      - 'research/**'
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Validate research preservation snapshot, if present
        run: |
          if [ -f research/RESEARCH_PORTFOLIO_CLOSURE_MANIFEST_20261102.json ]; then
            python scripts/validate_research_portfolio_closure.py research/RESEARCH_PORTFOLIO_CLOSURE_MANIFEST_20261102.json
            python -m unittest discover -s tests -p 'test_portfolio_closure_manifest.py' -v
          else
            echo "No research registry in this checkout"
          fi
      - name: Run tests
        run: pytest
