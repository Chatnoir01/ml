name: Phase 0 CI

on:
  push:
    branches:
      - main
      - 'research/**'
  pull_request:

permissions:
  contents: read

# A new commit supersedes *only* older CI runs on the same PR or push ref.
# Do not use this cancellation policy for preregistered scientific experiments.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install -e '.[dev]'
      - name: Run tests
        run: pytest
