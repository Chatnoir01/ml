name: CryptoWall V1 Envelope (NO PRODUCTION CLAIM)

on:
  pull_request:
    paths:
      - "src/cryptowall/**"
      - "tests/test_crypto_wall.py"
      - "security/CRYPTO_WALL_V1_THREAT_MODEL.md"
      - "pyproject.toml"
      - ".github/workflows/crypto-wall.yml"
  workflow_dispatch:

permissions:
  contents: read

# Cancel only superseded smoke runs on the same PR, not frozen experiments.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  envelope-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: pyproject.toml
      - name: Install research package plus isolated crypto wall dependencies
        run: python -m pip install -e ".[dev,crypto]"
      - name: Byte-for-byte envelope regression and negative tests
        run: python -m pytest -q tests/test_crypto_wall.py
