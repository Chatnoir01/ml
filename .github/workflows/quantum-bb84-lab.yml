name: Quantum BB84 Simulation (NO QKD SECURITY CLAIM)

on:
  pull_request:
    paths:
      - "src/quantum_lab/**"
      - "tests/test_quantum_lab_bb84.py"
      - "research/BB84_IDEALIZED_SIMULATION_PROTOCOL.md"
      - ".github/workflows/quantum-bb84-lab.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  idealized-bb84:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - name: Verify BB84 statistical simulation and all security nonclaims
        run: python -m pytest -q tests/test_quantum_lab_bb84.py
