name: RAVEN research invariant tests

on:
  push:
    branches:
      - "research/raven-*"
    paths:
      - "research/raven_*.py"
      - "tests/test_raven*.py"
      - "pyproject.toml"
      - ".github/workflows/raven-research.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  models:
    name: Python 3.11 / RAVEN state models
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install required test dependencies
        run: python -m pip install "pytest>=8,<10" "cryptography>=43,<50"
      - name: Run RAVEN-002 and RAVEN-003 tests
        run: python -m pytest -q tests/test_raven_model.py tests/test_raven_signed_model.py
