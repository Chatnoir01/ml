name: Phase 1C Development

on:
  push:
    branches:
      - research/phase1c-balanced-feasibility
    paths:
      - '.github/workflows/phase1c-dev.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  develop:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - name: balanced_swap1
            mutation_swaps: 1
          - name: balanced_swap2
            mutation_swaps: 2
          - name: balanced_swap3
            mutation_swaps: 3
          - name: balanced_swap4
            mutation_swaps: 4
          - name: balanced_swap5
            mutation_swaps: 5
    steps:
      - name: Checkout frozen Phase 1C development
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package
        run: python -m pip install -e .
      - name: Run equal-budget balanced development configuration
        run: |
          python -m adversarial_sbox.phase1c_benchmark \
            --seeds 503 509 521 523 541 \
            --population-size 12 \
            --generations 8 \
            --elite-count 2 \
            --tournament-size 3 \
            --mutation-swaps ${{ matrix.mutation_swaps }} \
            --crossover-rate 0.0 \
            --immigrant-fraction 0.0 \
            --offspring-multiplier 3 \
            --output phase1c-${{ matrix.name }}.json
      - name: Show balanced summary
        if: always()
        run: |
          if [ -f phase1c-${{ matrix.name }}.json ]; then
            python -c "import json; d=json.load(open('phase1c-${{ matrix.name }}.json')); print(json.dumps(d['summary'], indent=2, sort_keys=True))"
          fi
      - name: Upload Phase 1C development evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1c-${{ matrix.name }}-${{ github.sha }}
          path: phase1c-${{ matrix.name }}.json
          if-no-files-found: error
          retention-days: 30
