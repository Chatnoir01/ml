name: Phase 2U registered source pilot 41003 (NO NEURAL)

on:
  pull_request:
    types: [synchronize]
    paths:
      - "research/PHASE2U_PILOT_TRIGGER_41003.txt"
      - ".github/workflows/phase2u-source-pilot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pilot:
    name: 340 evaluated S-Boxes, source seed 41003
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Enforce single explicit classical pilot commit
        id: pilot_gate
        run: |
          subject="$(git log -1 --pretty=%s)"
          if [ "$subject" = "ci: run Phase 2U frozen pilot seed 41003" ]; then
            echo "run_pilot=true" >> "$GITHUB_OUTPUT"
            echo "One-time, preregistered 41003 pilot authorized by commit message"
          else
            echo "run_pilot=false" >> "$GITHUB_OUTPUT"
            echo "Skipping expensive classical seed run for unrelated PR update"
          fi
      - name: Install test dependencies
        if: steps.pilot_gate.outputs.run_pilot == 'true'
        run: python -m pip install -e ".[dev]"
      - name: Verify source integrity prior to execution
        if: steps.pilot_gate.outputs.run_pilot == 'true'
        run: python -m pytest -q tests/test_phase2u_generate.py
      - name: Generate exact first new seed — no neural measurements
        if: steps.pilot_gate.outputs.run_pilot == 'true'
        run: |
          python -m adversarial_sbox.phase2u_generate --seed 41003 --output seed-41003.json
          python - <<'PY'
          import json
          from pathlib import Path
          from adversarial_sbox.phase2u_generate import SOURCE_VERSION,digest
          r=json.loads(Path('seed-41003.json').read_text())
          sha=r.pop('source_payload_sha256')
          assert sha==digest(r)
          assert r['source_version']==SOURCE_VERSION
          assert r['seed']==41003 and r['classical_evaluations']==340
          assert r['new_neural_training_count']==0
          assert r['status'] in ('accepted','ineligible')
          print('PHASE2U_REGISTERED_SEED_STATUS='+r['status'])
          print('PHASE2U_REGISTERED_SEED_SHA256='+sha)
          print('PHASE2U_RANDOM_FALLBACK_COUNT='+str(r['random_swap_fallback_count']))
          PY
      - name: Archive original version-2 seed source
        if: steps.pilot_gate.outputs.run_pilot == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: phase2u-source-v1-seed-41003
          path: seed-41003.json
          retention-days: 60
          if-no-files-found: error
