name: Phase 2A-D Depth Attenuation

on:
  push:
    branches:
      - research/phase2ad-depth-attenuation
    paths:
      - research/PHASE2AD_EXECUTE.md

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install neural package
        run: python -m pip install -e '.[neural]'
      - name: Verify frozen Phase 2A-D lock
        run: |
          python - <<'PY'
          from pathlib import Path
          from adversarial_sbox.phase2ad import (
              ARCHITECTURE,
              DATASET_SEEDS,
              DEPTHS,
              DIFFERENCES,
              HETEROGENEITY_PERMUTATION_SEEDS,
              MODEL_SEEDS,
              PANEL_DIGEST_SHA256,
              PERMUTATION_REPETITIONS,
              PRIMARY_ATTENUATION_RATIO_MAX,
              PRIMARY_PERMUTATION_SEED,
              SECONDARY_PERMUTATION_SEED,
              TOTAL_TRAININGS,
          )
          from adversarial_sbox.phase2ad_runner import expected_cell_keys, load_frozen_panel

          marker = Path('research/PHASE2AD_EXECUTE.md').read_text()
          assert 'AUTHORIZED_PHASE2AD_DEPTH_ATTENUATION' in marker
          previous = Path('research/PHASE2AR_RESULT.md').read_text()
          assert 'phase2ar_inconclusive_signal' in previous
          assert PANEL_DIGEST_SHA256 == '35898535a0df0cfe64431e5f0b6142115d40e3dbeed4a973faa9ba70b1028a30'
          assert len(load_frozen_panel()) == 6
          assert ARCHITECTURE == 'byte_tanh_mlp'
          assert DEPTHS == (3, 4, 5)
          assert DIFFERENCES == (0x00000001, 0x00000100)
          assert DATASET_SEEDS == (73009, 73013, 73019, 73037, 73039, 73043, 73061, 73063, 73079, 73091)
          assert MODEL_SEEDS == (83003, 83009, 83023, 83047, 83059, 83063, 83071, 83077, 83089, 83101)
          assert HETEROGENEITY_PERMUTATION_SEEDS == {3: 92103, 4: 92104, 5: 92105}
          assert PERMUTATION_REPETITIONS == 10000
          assert PRIMARY_PERMUTATION_SEED == 92045
          assert SECONDARY_PERMUTATION_SEED == 92034
          assert PRIMARY_ATTENUATION_RATIO_MAX == 0.75
          assert TOTAL_TRAININGS == 360
          assert len(expected_cell_keys()) == 6
          print('PHASE2AD_PREFLIGHT_GREEN')
          PY
      - name: Record scientific SHA
        run: echo "PHASE2AD_SCIENTIFIC_SHA=${GITHUB_SHA}"

  cell:
    needs: preflight
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { depth: 3, difference: '0x00000001', label: 'R3-d1' }
          - { depth: 3, difference: '0x00000100', label: 'R3-d100' }
          - { depth: 4, difference: '0x00000001', label: 'R4-d1' }
          - { depth: 4, difference: '0x00000100', label: 'R4-d100' }
          - { depth: 5, difference: '0x00000001', label: 'R5-d1' }
          - { depth: 5, difference: '0x00000100', label: 'R5-d100' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install neural package
        run: python -m pip install -e '.[neural]'
      - name: Run frozen 60-training depth cell
        run: |
          python scripts/run_phase2ad.py \
            --depth '${{ matrix.depth }}' \
            --difference '${{ matrix.difference }}' \
            --output 'phase2ad-${{ matrix.label }}.json'
      - name: Show compact cell receipt
        run: |
          python - <<'PY'
          import glob, json
          path = glob.glob('phase2ad-*.json')[0]
          data = json.load(open(path))
          print('DEPTH:', data['depth'])
          print('ARCHITECTURE:', data['architecture'])
          print('DIFFERENCE:', hex(data['input_difference']))
          print('TRAININGS:', len(data['runs']))
          print('PAYLOAD_SHA256:', data['scientific_payload_sha256'])
          print('NEURAL_EVOLUTIONARY_PRESSURE:', data['neural_evolutionary_pressure'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: phase2ad-cell-${{ matrix.label }}-${{ github.sha }}
          path: phase2ad-${{ matrix.label }}.json
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: cell
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install neural package
        run: python -m pip install -e '.[neural]'
      - uses: actions/download-artifact@v4
        with:
          pattern: phase2ad-cell-*-${{ github.sha }}
          path: cells
          merge-multiple: true
      - name: Aggregate frozen depth test twice
        run: |
          python scripts/run_phase2ad.py --aggregate-files cells/phase2ad-*.json --output phase2ad-result-1.json
          python scripts/run_phase2ad.py --aggregate-files cells/phase2ad-*.json --output phase2ad-result-2.json
          cmp phase2ad-result-1.json phase2ad-result-2.json
          cp phase2ad-result-1.json phase2ad-result.json
      - name: Show official depth attenuation classification
        run: |
          python - <<'PY'
          import json
          data = json.load(open('phase2ad-result.json'))
          print('TOTAL_TRAININGS:', data['total_trainings'])
          print('PRIMARY_REQUIREMENTS_PASS:', data['primary_requirements_pass'])
          print('VARIANCE_TRAJECTORY:', json.dumps(data['variance_trajectory'], sort_keys=True))
          print('PRIMARY_4_TO_5:', json.dumps(data['primary_4_to_5'], sort_keys=True))
          print('SECONDARY_3_TO_4:', json.dumps(data['secondary_3_to_4'], sort_keys=True))
          for name, summary in data['depths'].items():
              print(name, 'p=', summary['heterogeneity_permutation_p'], 'range=', summary['candidate_score_range'], 'signal=', summary['signal_condition'])
          print('VERDICT:', data['verdict'])
          print('AGGREGATE_SHA256:', data['aggregate_payload_sha256'])
          print('NEURAL_EVOLUTIONARY_PRESSURE:', data['neural_evolutionary_pressure'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: phase2ad-summary-${{ github.sha }}
          path: phase2ad-result.json
          if-no-files-found: error
          retention-days: 90
