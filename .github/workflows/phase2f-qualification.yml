name: Phase 2F Pre-Marker Qualification

on:
  push:
    branches:
      - research/phase2f-minimal-band-pressure
  pull_request:
    paths:
      - '.github/workflows/phase2f*.yml'
      - 'research/PHASE2F_PROTOCOL.md'
      - 'scripts/run_phase2f.py'
      - 'src/adversarial_sbox/phase2f*.py'
      - 'src/adversarial_sbox/phase2_*seed_registry.py'
      - 'tests/test_phase2f*.py'

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Run frozen Phase 2F contract suite
        run: pytest -q tests/test_phase2f.py tests/test_phase2f_runner.py tests/test_phase2f_aggregate.py tests/test_phase2f_invariants.py
      - name: Verify pre-marker scientific isolation and fail-closed wiring
        run: |
          python - <<'PY'
          import inspect
          from pathlib import Path
          import adversarial_sbox.phase2f_runner as runner
          import adversarial_sbox.phase2f_terminal_freeze as freeze

          marker = Path('research/PHASE2F_EXECUTE.md')
          if marker.exists():
              assert marker.read_text(encoding='utf-8').strip() == 'AUTHORIZED_PHASE2F_MINIMAL_BAND_EXPERIMENT'
              print('PHASE2F_POST_MARKER_TOKEN_VALID')
          else:
              print('PHASE2F_PRE_MARKER_ABSENT_AS_REQUIRED')

          runner_source = inspect.getsource(runner)
          for forbidden in (
              'phase2f_validation',
              'VALIDATION_DATASET_SEEDS',
              'VALIDATION_MODEL_SEEDS',
              'purpose="validation"',
              "purpose='validation'",
          ):
              assert forbidden not in runner_source

          freeze_source = inspect.getsource(freeze.freeze_terminals)
          assert 'all_arm_invariants_report' in freeze_source
          assert 'band_invariants' in freeze_source

          cli = Path('scripts/run_phase2f.py').read_text(encoding='utf-8')
          assert 'terminal-freeze prerequisites failed closed' in cli
          assert 'aggregate prerequisites failed closed' in cli
          assert 'held-out validation receipt failed integrity gate' in cli

          workflow = Path('.github/workflows/phase2f.yml').read_text(encoding='utf-8')
          assert 'needs: terminal_freeze' in workflow
          assert 'research/PHASE2F_EXECUTE.md' in workflow
          assert 'AUTHORIZED_PHASE2F_MINIMAL_BAND_EXPERIMENT' in workflow
          print('PHASE2F_PRE_MARKER_QUALIFICATION_GREEN')
          PY
      - name: Verify no scientific authorization was added accidentally
        if: ${{ hashFiles('research/PHASE2F_EXECUTE.md') == '' }}
        run: test ! -e research/PHASE2F_EXECUTE.md
