name: Phase 2R Observation-Only Contract (NO TRAINING)

on:
  pull_request:
    paths:
      - "src/adversarial_sbox/phase2r_observation.py"
      - "tests/test_phase2r_observation.py"
      - "research/PHASE2R_OBSERVATION_ONLY_20261104.md"
      - ".github/workflows/phase2r-observation-only.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-observation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install existing research dependencies
        run: python -m pip install -e ".[dev]"
      - name: Observation helper synthetic regression tests (no training)
        run: python -m pytest -q tests/test_phase2r_observation.py
