name: Neural Crypto Lab Smoke (NO CIPHER DEPLOYMENT)

on:
  pull_request:
    paths:
      - "src/neural_crypto_lab/**"
      - "tests/test_neural_crypto_lab.py"
      - "scripts/run_neural_crypto_lab.py"
      - "research/NEURAL_CRYPTO_LAB_V1_PROTOCOL.md"
      - "pyproject.toml"
      - ".github/workflows/neural-crypto-lab.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install neural research test dependencies
        run: python -m pip install -e ".[dev,neural]"
      - name: Fail if NumPy unavailable (never silently skip lab tests)
        run: python -c "import numpy; print(numpy.__version__)"
      - name: Execute only deterministic, short lab regression tests
        run: python -m pytest -q tests/test_neural_crypto_lab.py
      - name: Short demonstration run (no scientific claim)
        run: python scripts/run_neural_crypto_lab.py --smoke --seed 621017
