name: Phase 2U Neural Receipt Contract (SYNTHETIC ONLY)

on:
  pull_request:
    paths:
      - "src/adversarial_sbox/phase2u_neural_contract.py"
      - "tests/test_phase2u_neural_contract.py"
      - "research/PHASE2U_NEURAL_RECEIPT_CONTRACT_REVIEW_20261105.md"
      - ".github/workflows/phase2u-neural-receipt-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-receipt-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install existing unit-test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Audit synthetic outcome schema without neural training
        run: python -m pytest -q -rs tests/test_phase2u_neural_contract.py
