name: Phase 1H Plateau-Directed Confirmation

on:
  workflow_dispatch:
  push:
    branches:
      - research/phase1h-plateau-directed
    paths:
      - .github/workflows/phase1h-confirmation.yml

jobs:
  confirm:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package
        run: python -m pip install -e .
      - name: Run frozen Phase 1H confirmation
        run: |
          python -m adversarial_sbox.phase1h_confirmation \
            --output phase1h-confirmation.json
      - name: Show frozen verdict
        run: |
          python -c "import json; d=json.load(open('phase1h-confirmation.json')); print(json.dumps(d['summary'], indent=2, sort_keys=True))"
      - name: Upload confirmation evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase1h-confirmation-${{ github.sha }}
          path: phase1h-confirmation.json
          if-no-files-found: error
          retention-days: 90
