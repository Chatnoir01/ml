name: Phase 2H Frozen Diagnostics

on:
  pull_request:
    paths:
      - ".github/workflows/phase2h-diagnostics.yml"
      - "scripts/run_phase2h.py"
      - "src/adversarial_sbox/phase2h.py"
      - "src/adversarial_sbox/phase2h_evidence.py"
      - "src/adversarial_sbox/phase2h_timeline.py"
      - "src/adversarial_sbox/phase2h_h3_archival.py"
      - "tests/test_phase2h*.py"
      - "research/PHASE2H_PROTOCOL.md"
      - "research/phase2h-evidence-inventory.json"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  frozen-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and preregistered diagnostic test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Download frozen Phase 2G A artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: phase2g-arm-A-*
          path: phase2g-inputs/A
          merge-multiple: false
          github-token: ${{ github.token }}
          run-id: 35572084785

      - name: Download frozen Phase 2G F artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: phase2g-arm-F-*
          path: phase2g-inputs/F
          merge-multiple: false
          github-token: ${{ github.token }}
          run-id: 35572084785

      - name: Verify exact primary evidence count
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t ARM_FILES < <(find phase2g-inputs -type f -name arm.json | sort)
          printf '%s\n' "${ARM_FILES[@]}"
          test "${#ARM_FILES[@]}" -eq 18

      - name: Build frozen evidence manifest
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t ARM_FILES < <(find phase2g-inputs -type f -name arm.json | sort)
          python scripts/run_phase2h.py \
            --arm-files "${ARM_FILES[@]}" \
            --prepare-manifest \
            --output research/phase2h-evidence-manifest.json

      - name: Run Phase 2H diagnostics
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t ARM_FILES < <(find phase2g-inputs -type f -name arm.json | sort)
          python scripts/run_phase2h.py \
            --arm-files "${ARM_FILES[@]}" \
            --evidence-manifest research/phase2h-evidence-manifest.json \
            --implementation-commit "${GITHUB_SHA}" \
            --output research/phase2h-diagnostics.json \
            --result-md research/PHASE2H_RESULT.md

      - name: Re-run diagnostics and prove byte identity
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t ARM_FILES < <(find phase2g-inputs -type f -name arm.json | sort -r)
          python scripts/run_phase2h.py \
            --arm-files "${ARM_FILES[@]}" \
            --evidence-manifest research/phase2h-evidence-manifest.json \
            --implementation-commit "${GITHUB_SHA}" \
            --output /tmp/phase2h-diagnostics-rerun.json \
            --result-md /tmp/PHASE2H_RESULT-rerun.md
          cmp research/phase2h-diagnostics.json /tmp/phase2h-diagnostics-rerun.json
          cmp research/PHASE2H_RESULT.md /tmp/PHASE2H_RESULT-rerun.md

      - name: Run Phase 2H tests
        run: pytest -q tests/test_phase2h.py tests/test_phase2h_evidence.py tests/test_phase2h_timeline.py tests/test_phase2h_runner.py tests/test_phase2h_h3_archival.py tests/test_phase2h_timeline_model_states.py

      - name: Assert original H3/H2 archival parity against independently preserved source
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          doc = json.loads(Path("research/phase2h-diagnostics.json").read_text())
          assert doc["availability"]["candidate_level_classical_distortion"] is True
          rows = doc["diagnostics"]
          assert len(rows) == 9
          expected_bad_seeds = {726049, 726061, 726073, 726113}
          for arm, expected_nonzero, expected_slots, expected_worse_events, expected_equal_events in (
              ("A", 356, 1895, 105, 255),
              ("F", 357, 1953, 107, 253),
          ):
              values = [row[f"{arm}_classical_distortion"] for row in rows.values()]
              assert all(x["available"] and x["event_count"] == 40 for x in values)
              assert sum(x["nonzero_event_count"] for x in values) == expected_nonzero
              assert sum(x["paired_membership_changes"] for x in values) == expected_slots
              assert sum(x["event_classifications"].get("all_worse_or_equal", 0) for x in values) == expected_worse_events
              assert sum(x["event_classifications"].get("all_equal", 0) for x in values) == expected_equal_events
              assert all(x["causal_claim_supported"] is False for x in values)
          for seed, row in rows.items():
              timeline = row["A_vs_F_timeline"]
              observed = timeline["checkpoints"][0]["model_state_sha256_differing_count"]
              expected = 16 if int(seed) in expected_bad_seeds else 0
              assert observed == expected, (seed, observed, expected)
              assert timeline["first_curriculum_divergence_generation"] == 5
              assert timeline["first_model_divergence_generation"] == (0 if expected else 5)
          print("SOURCE_ARCHIVE_H3_H2_PARITY_CONFIRMED: 720 events, 3848 slots, 64/144 checkpoint0 mismatch")
          PY

      - name: Upload Phase 2H deterministic product
        uses: actions/upload-artifact@v4
        with:
          name: phase2h-diagnostics-${{ github.sha }}
          retention-days: 90
          if-no-files-found: error
          path: |
            research/phase2h-evidence-manifest.json
            research/phase2h-diagnostics.json
            research/PHASE2H_RESULT.md
