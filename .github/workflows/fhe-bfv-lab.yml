name: Homomorphic BFV Lab (NO USER DATA)

on:
  pull_request:
    paths:
      - "src/fhe_lab/**"
      - "tests/test_fhe_lab.py"
      - "research/FHE_BFV_SUM_PROTOCOL.md"
      - "pyproject.toml"
      - ".github/workflows/fhe-bfv-lab.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  encrypted-sum:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # TenSEAL >=0.3.18 publishes CPython 3.11+ wheels, not Python 3.10.
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install actual TenSEAL FHE backend
        run: python -m pip install -e ".[dev,fhe]"
      - name: Fail if TenSEAL absent — no mock FHE
        run: python -c "import tenseal; print('TenSEAL', tenseal.__version__)"
      - name: Compute real BFV ciphertext sum with no server-side secret
        run: python -m pytest -q tests/test_fhe_lab.py
