name: Phase 2R Pinned Input Preflight (NO TRAINING)

on:
  pull_request:
    paths:
      - "src/adversarial_sbox/phase2r_input_preflight.py"
      - "tests/test_phase2r_input_preflight.py"
      - "research/PHASE2R_INPUT_PREFLIGHT_20261025.md"
      - ".github/workflows/phase2r-input-preflight.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pinned-input-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install research test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Verify actual Phase 2G input generator on pinned Phase 2R fixture
        run: python -m pytest -q tests/test_phase2r_input_preflight.py
      - name: Compare hashed input receipts across separate processes on the same host
        shell: bash
        run: |
          python -c 'import json; from adversarial_sbox.phase2r_input_preflight import preflight_phase2r_input_cell as p; print(json.dumps(p(difference=1,replicate=0),sort_keys=True,separators=(",",":")))' > /tmp/phase2r-0.json
          python -c 'import json; from adversarial_sbox.phase2r_input_preflight import preflight_phase2r_input_cell as p; print(json.dumps(p(difference=1,replicate=0),sort_keys=True,separators=(",",":")))' > /tmp/phase2r-1.json
          cmp /tmp/phase2r-0.json /tmp/phase2r-1.json
          python -c 'import json; r=json.load(open("/tmp/phase2r-0.json")); assert r["status"]=="SAME_PROCESS_INPUT_PRECHECK_PASS"; assert r["cross_process_reproducibility_established"] is False; assert r["neural_training_performed"] is False; assert r["historical_discrepancy_explained"] is False; print("Input hash receipt match on one runner; no training or crypto claim.")'
