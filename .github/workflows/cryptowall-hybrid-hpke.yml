name: CryptoWall Hybrid HPKE (RESEARCH ONLY)

on:
  pull_request:
    paths:
      - "src/cryptowall/hybrid_hpke.py"
      - "tests/test_cryptowall_hybrid_hpke.py"
      - "research/CRYPTOWALL_HYBRID_HPKE_PROTOCOL.md"
      - "pyproject.toml"
      - ".github/workflows/cryptowall-hybrid-hpke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  actual-hybrid-no-fallback:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install opt-in hybrid backend and test tools
        run: python -m pip install -e ".[dev,crypto,pq]"
      - name: Hard gate — genuine ML-KEM capability, never silently skip
        run: |
          python -c "from cryptowall.hybrid_hpke import hybrid_capability; assert hybrid_capability(), 'ML-KEM backend unavailable'; print('ML-KEM-768 backend OK')"
      - name: Actual X25519 + ML-KEM-768 HPKE end-to-end and negative tests
        run: python -m pytest -q tests/test_cryptowall_hybrid_hpke.py
