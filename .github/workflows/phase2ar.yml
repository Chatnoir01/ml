name: Phase 2A-R Rank Instability Decomposition

on:
  push:
    branches:
      - research/phase2ar-rank-decomposition
    paths:
      - research/PHASE2AR_EXECUTE.md

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install neural package
        run: python -m pip install -e '.[neural]'
      - name: Verify frozen Phase 2A-R lock
        run: |
          python - <<'PY'
          from pathlib import Path
          from adversarial_sbox.phase2ar import (
              DATASET_SEEDS, MODEL_SEEDS, PANEL_DIGEST_SHA256,
              PERMUTATION_REPETITIONS, PERMUTATION_SEEDS, REGIMES,
              TOTAL_TRAININGS,
          )
          from adversarial_sbox.phase2ar_runner import expected_cell_keys, load_frozen_panel

          marker = Path('research/PHASE2AR_EXECUTE.md').read_text()
          assert 'AUTHORIZED_PHASE2AR_DIAGNOSTIC' in marker
          result = Path('research/PHASE2A_RESULT.md').read_text()
          assert 'phase2a_oracle_not_qualified' in result
          assert PANEL_DIGEST_SHA256 == '35898535a0df0cfe64431e5f0b6142115d40e3dbeed4a973faa9ba70b1028a30'
          assert len(load_frozen_panel()) == 6
          assert DATASET_SEEDS == (71001, 71009, 71023, 71039, 71059)
          assert MODEL_SEEDS == (81001, 81013, 81031, 81041, 81047)
          assert PERMUTATION_REPETITIONS == 10000
          assert PERMUTATION_SEEDS == {'A': 91001, 'B': 91009, 'C': 91023, 'D': 91039}
          assert TOTAL_TRAININGS == 240
          assert len(REGIMES) == 4
          assert len(expected_cell_keys()) == 8
          print('PHASE2AR_PREFLIGHT_GREEN')
          PY
      - name: Record scientific SHA
        run: echo "PHASE2AR_SCIENTIFIC_SHA=${GITHUB_SHA}"

  cell:
    needs: preflight
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { regime: A, difference: '0x00000001', label: 'A-d1' }
          - { regime: A, difference: '0x00000100', label: 'A-d100' }
          - { regime: B, difference: '0x00000001', label: 'B-d1' }
          - { regime: B, difference: '0x00000100', label: 'B-d100' }
          - { regime: C, difference: '0x00000001', label: 'C-d1' }
          - { regime: C, difference: '0x00000100', label: 'C-d100' }
          - { regime: D, difference: '0x00010000', label: 'D-d10000' }
          - { regime: D, difference: '0x01000000', label: 'D-d1000000' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install neural package
        run: python -m pip install -e '.[neural]'
      - name: Run frozen 30-training bridge cell
        run: |
          python scripts/run_phase2ar.py \
            --regime '${{ matrix.regime }}' \
            --difference '${{ matrix.difference }}' \
            --output 'phase2ar-${{ matrix.label }}.json'
      - name: Show compact cell receipt
        run: |
          python - <<'PY'
          import glob, json
          path = glob.glob('phase2ar-*.json')[0]
          data = json.load(open(path))
          print('REGIME:', data['regime'])
          print('ARCHITECTURE:', data['architecture'])
          print('ROUNDS:', data['rounds'])
          print('DIFFERENCE:', hex(data['input_difference']))
          print('TRAININGS:', len(data['runs']))
          print('PAYLOAD_SHA256:', data['scientific_payload_sha256'])
          print('NEURAL_EVOLUTIONARY_PRESSURE:', data['neural_evolutionary_pressure'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: phase2ar-cell-${{ matrix.label }}-${{ github.sha }}
          path: phase2ar-${{ matrix.label }}.json
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: cell
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install neural package
        run: python -m pip install -e '.[neural]'
      - uses: actions/download-artifact@v4
        with:
          pattern: phase2ar-cell-*-${{ github.sha }}
          path: cells
          merge-multiple: true
      - name: Aggregate frozen diagnostic twice
        run: |
          python scripts/run_phase2ar.py --aggregate-files cells/phase2ar-*.json --output phase2ar-result-1.json
          python scripts/run_phase2ar.py --aggregate-files cells/phase2ar-*.json --output phase2ar-result-2.json
          cmp phase2ar-result-1.json phase2ar-result-2.json
          cp phase2ar-result-1.json phase2ar-result.json
      - name: Show official diagnostic classification
        run: |
          python - <<'PY'
          import json
          data = json.load(open('phase2ar-result.json'))
          print('TOTAL_TRAININGS:', data['total_trainings'])
          print('ALL_SIGNAL_PREREQUISITES_PASS:', data['all_signal_prerequisites_pass'])
          print('ADJACENT_SPEARMAN:', json.dumps(data['adjacent_spearman'], sort_keys=True))
          for name, summary in data['regimes'].items():
              print(name, 'p=', summary['heterogeneity_permutation_p'], 'range=', summary['candidate_score_range'], 'signal=', summary['signal_condition'])
          print('VERDICT:', data['verdict'])
          print('AGGREGATE_SHA256:', data['aggregate_payload_sha256'])
          print('NEURAL_EVOLUTIONARY_PRESSURE:', data['neural_evolutionary_pressure'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: phase2ar-summary-${{ github.sha }}
          path: phase2ar-result.json
          if-no-files-found: error
          retention-days: 90
