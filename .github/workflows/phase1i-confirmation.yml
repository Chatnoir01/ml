name: Phase 1I Fresh Confirmation

on:
  workflow_dispatch:
  push:
    branches:
      - research/phase1i-fresh-vns-batch
    paths:
      - research/PHASE1I_SELECTION.json

jobs:
  confirm-pair:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        seed: [1801, 1811, 1823, 1831, 1847, 1861, 1871, 1873, 1877]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package
        run: python -m pip install -e .
      - name: Run frozen fresh confirmation pair
        run: |
          python -m adversarial_sbox.phase1i_confirmation pair \
            --selection research/PHASE1I_SELECTION.json \
            --seed ${{ matrix.seed }} \
            --output phase1i-confirm-${{ matrix.seed }}.json
      - name: Upload pair evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase1i-confirm-pair-${{ matrix.seed }}-${{ github.sha }}
          path: phase1i-confirm-${{ matrix.seed }}.json
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: confirm-pair
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package
        run: python -m pip install -e .
      - name: Download pair evidence
        uses: actions/download-artifact@v4
        with:
          pattern: phase1i-confirm-pair-*-${{ github.sha }}
          path: confirmation-pairs
          merge-multiple: true
      - name: Aggregate frozen confirmation verdict
        run: |
          python -m adversarial_sbox.phase1i_confirmation aggregate \
            --selection research/PHASE1I_SELECTION.json \
            confirmation-pairs/phase1i-confirm-*.json \
            --output phase1i-confirmation.json
      - name: Show verdict
        run: |
          python -c "import json; d=json.load(open('phase1i-confirmation.json')); print(json.dumps(d['summary'], indent=2, sort_keys=True))"
      - name: Upload confirmation verdict
        uses: actions/upload-artifact@v4
        with:
          name: phase1i-confirmation-verdict-${{ github.sha }}
          path: phase1i-confirmation.json
          if-no-files-found: error
          retention-days: 90
