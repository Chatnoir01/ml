name: Fast Feedback (NO RESEARCH TRAINING)

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'secure_core_mobile/**'
      - 'research/fixtures/phase2r-*'
      - 'scripts/select_fast_tests.py'
      - '.github/workflows/fast-feedback.yml'
      - 'pyproject.toml'

permissions:
  contents: read

# Cancel superseded feedback for this PR only. Mandatory complete CI
# and preregistered research/hardware jobs remain independent.
concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Focused Python 3.12 smoke / security regression
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout PR merge commit and base parent
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Python 3.12 with dependency download cache
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install existing development/test dependencies
        run: python -m pip install -e '.[dev]'

      - name: Read only files changed by this pull request
        shell: bash
        run: |
          set -euo pipefail
          # pull_request checkouts use a synthetic merge commit:
          # HEAD^1 is the PR base and HEAD contains the PR changes.
          git rev-parse --verify HEAD^1
          git diff --name-only HEAD^1 HEAD > "${RUNNER_TEMP}/fast-feedback-paths.txt"
          cat "${RUNNER_TEMP}/fast-feedback-paths.txt"

      - name: Run deterministic focused tests (NO MODEL TRAINING)
        shell: bash
        run: |
          set -euo pipefail
          python scripts/select_fast_tests.py \
            --changed-file-list "${RUNNER_TEMP}/fast-feedback-paths.txt"
