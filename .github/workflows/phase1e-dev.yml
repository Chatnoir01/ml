name: Phase 1E Spectral Guided Development

on:
  push:
    branches:
      - research/phase1e-spectral-guided
    paths:
      - '.github/workflows/phase1e-dev.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  develop:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: spectral32_s1
            mode: spectral
            proposals: 32
            swaps: 1
          - name: spectral96_s1
            mode: spectral
            proposals: 96
            swaps: 1
          - name: ddt64_s1
            mode: ddt
            proposals: 64
            swaps: 1
          - name: hybrid64_s1
            mode: hybrid
            proposals: 64
            swaps: 1
          - name: hybrid64_s2
            mode: hybrid
            proposals: 64
            swaps: 2
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package
        run: python -m pip install -e .
      - name: Run preregistered Phase 1E development
        run: |
          python -m adversarial_sbox.phase1e \
            --seeds 907 911 919 929 937 \
            --evaluations 480 \
            --mode ${{ matrix.mode }} \
            --proposal-pairs ${{ matrix.proposals }} \
            --swaps ${{ matrix.swaps }} \
            --output phase1e-${{ matrix.name }}.json
      - name: Show summary
        if: always()
        run: |
          if [ -f phase1e-${{ matrix.name }}.json ]; then
            python -c "import json; d=json.load(open('phase1e-${{ matrix.name }}.json')); print(json.dumps(d['summary'], indent=2, sort_keys=True))"
          fi
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1e-${{ matrix.name }}-${{ github.sha }}
          path: phase1e-${{ matrix.name }}.json
          if-no-files-found: error
          retention-days: 30
