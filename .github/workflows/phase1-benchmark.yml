name: Phase 1 Benchmark

on:
  push:
    branches:
      - main
      - research/phase1-benchmark
  pull_request:
    paths:
      - 'src/adversarial_sbox/**'
      - '.github/workflows/phase1-benchmark.yml'

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package
        run: python -m pip install -e .
      - name: Run matched-budget benchmark
        run: |
          python -m adversarial_sbox.benchmark \
            --seeds 11 23 37 \
            --population-size 8 \
            --generations 3 \
            --output phase1-benchmark.json
      - name: Show summary
        if: always()
        run: |
          if [ -f phase1-benchmark.json ]; then
            python -c "import json; d=json.load(open('phase1-benchmark.json')); print(json.dumps(d['summary'], indent=2, sort_keys=True))"
          fi
      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-benchmark-${{ github.sha }}
          path: phase1-benchmark.json
          if-no-files-found: error
          retention-days: 30
