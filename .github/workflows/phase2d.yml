name: Phase 2D Bounded Persistence

on:
  push:
    branches:
      - research/phase2d-bounded-persistence
    paths:
      - research/PHASE2D_EXECUTE.md

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install full test and neural dependencies
        run: python -m pip install -e '.[dev,neural]'
      - name: Verify frozen Phase 2D execution lock without loading held-out seeds
        run: |
          python - <<'PY'
          import inspect
          import random
          from pathlib import Path
          import adversarial_sbox.phase2d_runner as runner
          from adversarial_sbox.phase2_evolution_seed_registry import phase2d_evolution_seeds_are_fresh
          from adversarial_sbox.phase2_neural_seed_registry import complete_seed_registry_through_phase2b
          from adversarial_sbox.phase2d import (
              ARMS, EVOLUTION_SEEDS, FITNESS_DATASET_SEEDS, FITNESS_MODEL_SEEDS,
              CLASSICAL_BUDGET_PER_ARM_SEED, ORACLE_TRAININGS_PER_SCORE,
              ORACLE_SCORE_BUDGET_PER_ARM_SEED, FITNESS_TRAININGS_PER_ARM_SEED,
              TOTAL_FITNESS_TRAININGS, SHUFFLE_SEED_OFFSET,
          )
          from adversarial_sbox.phase2d_runner import make_shuffled_control_rng

          assert Path('research/PHASE2D_EXECUTE.md').read_text(encoding='utf-8').strip() == 'AUTHORIZED_PHASE2D_BOUNDED_PERSISTENCE_EXPERIMENT'
          protocol = Path('research/PHASE2D_PROTOCOL.md').read_text(encoding='utf-8')
          assert '#109' in protocol and '#110' in protocol
          assert ARMS == ('C', 'O0', 'OP1', 'SP1')
          assert CLASSICAL_BUDGET_PER_ARM_SEED == 340
          assert ORACLE_TRAININGS_PER_SCORE == 16
          assert ORACLE_SCORE_BUDGET_PER_ARM_SEED == 32
          assert FITNESS_TRAININGS_PER_ARM_SEED == 512
          assert TOTAL_FITNESS_TRAININGS == 18432
          assert phase2d_evolution_seeds_are_fresh(EVOLUTION_SEEDS)
          prior = set(complete_seed_registry_through_phase2b())
          fitness = set(FITNESS_DATASET_SEEDS) | set(FITNESS_MODEL_SEEDS)
          assert len(fitness) == 16 and fitness.isdisjoint(prior)
          source = inspect.getsource(runner)
          for forbidden in ('score_terminal_candidate', 'purpose="validation"', "purpose='validation'"):
              assert forbidden not in source
          probe = EVOLUTION_SEEDS[0]
          lhs = make_shuffled_control_rng(probe)
          rhs = random.Random(probe + SHUFFLE_SEED_OFFSET)
          assert [lhs.random() for _ in range(16)] == [rhs.random() for _ in range(16)]
          print('PHASE2D_EXECUTION_LOCK_GREEN_FITNESS_ONLY')
          PY
      - name: Run complete regression suite
        run: pytest
      - name: Re-run historical Phase 1 benchmark
        run: |
          python -m adversarial_sbox.benchmark \
            --seeds 11 23 37 \
            --population-size 8 \
            --generations 3 \
            --output phase1-benchmark.json
      - name: Record scientific SHA
        run: echo "PHASE2D_SCIENTIFIC_SHA=${GITHUB_SHA}"

  arm:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        arm: [C, O0, OP1, SP1]
        seed: [426011, 426023, 426037, 426049, 426061, 426073, 426089, 426101, 426113]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install neural package
        run: python -m pip install -e '.[neural]'
      - name: Run frozen Phase 2D fitness arm
        run: |
          python scripts/run_phase2d.py \
            --seed '${{ matrix.seed }}' \
            --arm '${{ matrix.arm }}' \
            --output arm.json
      - name: Verify exact arm budgets
        run: |
          python - <<'PY'
          import json
          data = json.load(open('arm.json'))
          assert data['classical_evaluations'] == 340
          assert data['oracle_candidate_scores'] == 32
          assert data['oracle_fitness_trainings'] == 512
          print('ARM:', data['arm'], 'SEED:', data['seed'])
          print('TERMINAL:', data['terminal_fingerprint'])
          print('ARM_SHA256:', data['scientific_payload_sha256'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: phase2d-arm-${{ matrix.arm }}-${{ matrix.seed }}-${{ github.sha }}
          path: arm.json
          if-no-files-found: error
          retention-days: 90

  terminal_freeze:
    needs: arm
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package
        run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: phase2d-arm-*-${{ github.sha }}
          path: arm-results
      - name: Freeze all 36 terminals twice and require byte identity
        run: |
          python scripts/run_phase2d.py \
            --freeze-arm-files arm-results/phase2d-arm-*/arm.json \
            --output freeze-1.json
          python scripts/run_phase2d.py \
            --freeze-arm-files arm-results/phase2d-arm-*/arm.json \
            --output freeze-2.json
          cmp freeze-1.json freeze-2.json
          cp freeze-1.json phase2d-terminal-freeze.json
          python - <<'PY'
          import json
          data = json.load(open('phase2d-terminal-freeze.json'))
          assert data['cell_count'] == 36
          assert data['prerequisites']['pass'] is True
          assert len(data['terminals']) == 36
          print('TERMINAL_FREEZE_SHA256:', data['terminal_freeze_sha256'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: phase2d-terminal-freeze-${{ github.sha }}
          path: phase2d-terminal-freeze.json
          if-no-files-found: error
          retention-days: 90

  validation:
    needs: terminal_freeze
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        arm: [C, O0, OP1, SP1]
        seed: [426011, 426023, 426037, 426049, 426061, 426073, 426089, 426101, 426113]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install neural package
        run: python -m pip install -e '.[neural]'
      - uses: actions/download-artifact@v4
        with:
          name: phase2d-arm-${{ matrix.arm }}-${{ matrix.seed }}-${{ github.sha }}
          path: arm-cell
      - uses: actions/download-artifact@v4
        with:
          name: phase2d-terminal-freeze-${{ github.sha }}
          path: terminal-freeze
      - name: Validate only after terminal freeze
        run: |
          python scripts/run_phase2d.py \
            --seed '${{ matrix.seed }}' \
            --arm '${{ matrix.arm }}' \
            --validate-arm-result arm-cell/arm.json \
            --terminal-freeze terminal-freeze/phase2d-terminal-freeze.json \
            --output validation.json
      - name: Show held-out receipt
        run: |
          python - <<'PY'
          import json
          data = json.load(open('validation.json'))
          print('ARM:', data['arm'], 'SEED:', data['seed'])
          print('HELDOUT_ADVANTAGE:', data['score']['neural_advantage'])
          print('VALIDATION_SHA256:', data['score']['scientific_payload_sha256'])
          print('TERMINAL_FREEZE_SHA256:', data['terminal_freeze_sha256'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: phase2d-validation-${{ matrix.arm }}-${{ matrix.seed }}-${{ github.sha }}
          path: validation.json
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: validation
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package
        run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: phase2d-arm-*-${{ github.sha }}
          path: arm-results
      - uses: actions/download-artifact@v4
        with:
          pattern: phase2d-validation-*-${{ github.sha }}
          path: validation-results
      - name: Aggregate twice and require byte identity
        run: |
          python scripts/run_phase2d.py \
            --aggregate-arm-files arm-results/phase2d-arm-*/arm.json \
            --aggregate-validation-files validation-results/phase2d-validation-*/validation.json \
            --output phase2d-result-1.json
          python scripts/run_phase2d.py \
            --aggregate-arm-files arm-results/phase2d-arm-*/arm.json \
            --aggregate-validation-files validation-results/phase2d-validation-*/validation.json \
            --output phase2d-result-2.json
          cmp phase2d-result-1.json phase2d-result-2.json
          cp phase2d-result-1.json phase2d-result.json
      - name: Show frozen classification
        run: |
          python - <<'PY'
          import json
          data = json.load(open('phase2d-result.json'))
          assert data['verdict'] in {
              'phase2d_bounded_persistence_supported',
              'phase2d_bounded_persistence_not_supported',
              'phase2d_inconclusive_prerequisites',
          }
          print('PREREQUISITES:', json.dumps(data['prerequisites'], sort_keys=True))
          print('CLASSICAL_NON_DEGRADATION:', data['classical_non_degradation'])
          print('SUPPORT_CHECKS:', json.dumps(data['support']['checks'], sort_keys=True))
          print('TRANSMISSION:', json.dumps(data['support']['mechanism_transmission'], sort_keys=True))
          print('PAIRED_OP1_VS_O0:', json.dumps(data['support']['paired_op1_vs_o0'], sort_keys=True))
          print('SPECIFICITY:', json.dumps(data['support']['specificity_op1_vs_sp1'], sort_keys=True))
          print('VERDICT:', data['verdict'])
          print('AGGREGATE_SHA256:', data['aggregate_payload_sha256'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: phase2d-summary-${{ github.sha }}
          path: phase2d-result.json
          if-no-files-found: error
          retention-days: 90
