name: Phase 2V T9 fresh-parent source predictor

on:
  push:
    branches:
      - research/phase2v-t9-fresh-parent-prediction-20261119
  pull_request:
    paths:
      - "scripts/phase2v_t9_*"
      - "research/PHASE2V_T9_*"
      - ".github/workflows/phase2v-t9.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replicate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install original standard-library science source
        run: python -m pip install -e .
      - name: Run exact preregistered 1152-panel T9 twice
        shell: bash
        run: |
          set -euo pipefail
          python scripts/phase2v_t9_cross_parent_prediction.py --out "$RUNNER_TEMP/t9-first.json"
          python scripts/phase2v_t9_cross_parent_prediction.py --out "$RUNNER_TEMP/t9-second.json"
          cmp "$RUNNER_TEMP/t9-first.json" "$RUNNER_TEMP/t9-second.json"
          sha256sum "$RUNNER_TEMP/t9-first.json"
      - name: Independent recomputation of all source bytes and panels
        shell: bash
        run: |
          set -euo pipefail
          HASH=$(sha256sum "$RUNNER_TEMP/t9-first.json" | cut -d' ' -f1)
          python scripts/phase2v_t9_independent_audit.py --report "$RUNNER_TEMP/t9-first.json" --expected-sha "$HASH"
      - name: Explicit fail-closed adversarial negative controls
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import copy,json,os
          from pathlib import Path
          from scripts.phase2v_t9_independent_audit import verify_shape,check_one_panel,audit
          data=json.loads((Path(os.environ["RUNNER_TEMP"])/"t9-first.json").read_text())
          cases=[
            ("missing panel",lambda x:x["panels"].pop(),verify_shape),
            ("duplicate panel",lambda x:x["panels"].append(copy.deepcopy(x["panels"][0])),verify_shape),
            ("forged ciphertext AUC",lambda x:x["panels"][0].update(auc=0.999),lambda x:check_one_panel(x,x["panels"][0])),
            ("forged plaintext source SHA",lambda x:x["panels"][0].update(pairs_sha256="0"*64),lambda x:check_one_panel(x,x["panels"][0])),
            ("tampered parent metric",lambda x:x["parent_boxes"][0]["global_metrics"].update(du=999),audit),
            ("tampered candidate fingerprint",lambda x:x["candidate_boxes"][0].update(sha256="0"*64),audit),
            ("tampered endpoint",lambda x:x["summary"].update(median_group_predictor_correlation=99.0),audit),
            ("tampered protocol SHA",lambda x:x.update(preregistration_commit="0"*40),verify_shape)
          ]
          for label,mutation,test in cases:
            altered=copy.deepcopy(data)
            mutation(altered)
            try:
              test(altered)
            except (ValueError,AssertionError,KeyError):
              print("PASS tamper rejection:",label)
            else:
              raise AssertionError("undetected tamper: "+label)
          PY
      - name: Retain exact source-output with short-term action artifact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: phase2v-t9-raw-1152-panels
          path: ${{ runner.temp }}/t9-first.json
          retention-days: 30
