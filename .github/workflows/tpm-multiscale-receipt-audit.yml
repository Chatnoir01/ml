name: TPM 96 Result Receipt Audit (NO CRYPTO CLAIM)

on:
  pull_request:
    paths:
      - "src/tpm_lab/multiscale_audit.py"
      - "tests/test_tpm_multiscale_audit.py"
      - "scripts/audit_tpm_multiscale_report.py"
      - "research/TPM_MULTISCALE_REPORT_AUDIT_PROTOCOL.md"
      - ".github/workflows/tpm-multiscale-receipt-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

# No repeat scientific experiments here; deterministic fake-fixture tests only.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  report-validator:
    name: Synthetic corruption-controls on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10","3.11","3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test suite
        run: python -m pip install -e ".[dev]"
      - name: Verify independent row reconstruction and tampering detectors
        run: python -m pytest -q tests/test_tpm_multiscale_audit.py
      - name: State validation scope explicitly
        run: echo "Synthetic fixture only; no held-out trial has been inspected or run in this workflow."
