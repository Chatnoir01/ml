name: Phase 2A Neural Oracle Qualification

on:
  push:
    branches:
      - research/phase2a-oracle-qualification
    paths:
      - research/PHASE2A_EXECUTE.md

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package
        run: python -m pip install -e '.[neural]'
      - name: Verify frozen Phase 2A scientific lock
        run: |
          python - <<'PY'
          from pathlib import Path
          from adversarial_sbox.evolution import evaluate_classical
          from adversarial_sbox.phase2a import (
              CHALLENGER_ARCHITECTURE,
              CHALLENGER_DIFFERENCES,
              CHALLENGER_ROUNDS,
              DATASET_SEEDS,
              MODEL_SEEDS,
              ORACLE_ARCHITECTURE,
              ORACLE_DIFFERENCES,
              ORACLE_ROUNDS,
              PANEL_SIZE,
              TOTAL_TRAININGS,
          )
          from adversarial_sbox.phase2a_candidates import CANDIDATES, PANEL_DIGEST_SHA256
          from adversarial_sbox.phase2a_neural import CELL_SPECS, PERMUTATION_REPETITIONS
          from adversarial_sbox.provenance import fingerprint_sbox

          assert Path('research/GATE1_STATUS.md').is_file()
          assert 'Status: **GREEN**' in Path('research/GATE1_STATUS.md').read_text(encoding='utf-8')
          assert Path('research/PHASE2A_PROTOCOL.md').is_file()
          marker = Path('research/PHASE2A_EXECUTE.md')
          assert marker.is_file()
          assert 'AUTHORIZED_PHASE2A_NEURAL_QUALIFICATION' in marker.read_text(encoding='utf-8')

          assert PANEL_SIZE == 6
          assert len(CANDIDATES) == 6
          assert isinstance(PANEL_DIGEST_SHA256, str) and len(PANEL_DIGEST_SHA256) == 64
          assert ORACLE_ARCHITECTURE == 'bit_relu_mlp'
          assert ORACLE_ROUNDS == 4
          assert ORACLE_DIFFERENCES == (0x00000001, 0x00000100)
          assert CHALLENGER_ARCHITECTURE == 'byte_tanh_mlp'
          assert CHALLENGER_ROUNDS == 5
          assert CHALLENGER_DIFFERENCES == (0x00010000, 0x01000000)
          assert DATASET_SEEDS == (51001, 51007, 51011, 51031, 51047)
          assert MODEL_SEEDS == (61001, 61007, 61027, 61031, 61043)
          assert TOTAL_TRAININGS == 120
          assert PERMUTATION_REPETITIONS == 10000
          assert CELL_SPECS == (
              ('oracle', 4, 0x00000001, 'bit_relu_mlp'),
              ('oracle', 4, 0x00000100, 'bit_relu_mlp'),
              ('challenger', 5, 0x00010000, 'byte_tanh_mlp'),
              ('challenger', 5, 0x01000000, 'byte_tanh_mlp'),
          )

          for candidate in CANDIDATES:
              sbox = tuple(int(value) for value in candidate['sbox'])
              metrics = evaluate_classical(sbox)
              assert fingerprint_sbox(sbox) == candidate['fingerprint']
              assert metrics.differential_uniformity == 8
              assert metrics.nonlinearity == 100
              assert metrics.max_linear_correlation == 56
              assert metrics.algebraic_degree == 7
              assert abs(metrics.sac_score - 0.5) <= 0.05
          print('Phase 2A frozen preflight OK')
          PY
      - name: Record scientific SHA
        run: git rev-parse HEAD

  cell:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - side: oracle
            difference: '0x00000001'
            slug: oracle-d1
          - side: oracle
            difference: '0x00000100'
            slug: oracle-d100
          - side: challenger
            difference: '0x00010000'
            slug: challenger-d10000
          - side: challenger
            difference: '0x01000000'
            slug: challenger-d1000000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install neural package
        run: python -m pip install -e '.[neural]'
      - name: Run frozen 30-training cell
        run: |
          python scripts/run_phase2a_oracle.py \
            --side '${{ matrix.side }}' \
            --input-difference '${{ matrix.difference }}' \
            --output 'phase2a-${{ matrix.slug }}.json'
      - name: Show compact cell receipt
        run: |
          python - <<'PY'
          import glob, json
          path = glob.glob('phase2a-*.json')[0]
          data = json.load(open(path))
          print('SIDE:', data['side'])
          print('DIFFERENCE:', data['input_difference'])
          print('ARCHITECTURE:', data['architecture'])
          print('TRAININGS:', len(data['runs']))
          print('PAYLOAD_SHA256:', data['scientific_payload_sha256'])
          print('NEURAL_EVOLUTIONARY_PRESSURE:', data['neural_evolutionary_pressure'])
          PY
      - name: Upload cell evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase2a-${{ matrix.slug }}-${{ github.sha }}
          path: phase2a-${{ matrix.slug }}.json
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: cell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install neural package
        run: python -m pip install -e '.[neural]'
      - name: Download frozen cell evidence
        uses: actions/download-artifact@v4
        with:
          pattern: phase2a-*-${{ github.sha }}
          path: cells
          merge-multiple: true
      - name: Aggregate frozen Phase 2A result twice
        run: |
          python scripts/run_phase2a_oracle.py \
            --aggregate-files cells/phase2a-*.json \
            --output phase2a-qualification.json
      - name: Show official qualification verdict
        run: |
          python - <<'PY'
          import json
          data = json.load(open('phase2a-qualification.json'))
          print(json.dumps(data['summary'], indent=2, sort_keys=True))
          print(json.dumps(data['qualification_checks'], indent=2, sort_keys=True))
          print('VERDICT:', data['verdict'])
          print('AGGREGATE_SHA256:', data['aggregate_payload_sha256'])
          PY
      - name: Upload aggregate evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase2a-qualification-summary-${{ github.sha }}
          path: phase2a-qualification.json
          if-no-files-found: error
          retention-days: 90
