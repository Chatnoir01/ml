name: Phase 1K ITO Cost

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/adversarial_sbox/cryptoshield.py'
      - 'src/adversarial_sbox/pareto.py'
      - 'research/PHASE1K_PROTOCOL.md'
      - '.github/workflows/phase1k-ito-cost.yml'

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package
        run: python -m pip install -e .
      - name: Measure classical and ITO cost on AES reference
        run: |
          python - <<'PY'
          import json
          import platform
          import time
          from pathlib import Path

          from adversarial_sbox.cryptoshield import improved_transparency_order
          from adversarial_sbox.evolution import evaluate_classical
          from adversarial_sbox.references import AES_SBOX

          start = time.perf_counter()
          classical = evaluate_classical(AES_SBOX)
          classical_seconds = time.perf_counter() - start

          start = time.perf_counter()
          ito = improved_transparency_order(AES_SBOX)
          ito_seconds = time.perf_counter() - start

          result = {
              'python': platform.python_version(),
              'classical_seconds': classical_seconds,
              'ito_seconds': ito_seconds,
              'ito_over_classical_ratio': ito_seconds / max(classical_seconds, 1e-12),
              'aes': {
                  'nonlinearity': classical.nonlinearity,
                  'differential_uniformity': classical.differential_uniformity,
                  'max_linear_correlation': classical.max_linear_correlation,
                  'algebraic_degree': classical.algebraic_degree,
                  'sac_score': classical.sac_score,
                  'improved_transparency_order': ito,
              },
          }
          Path('phase1k-ito-cost.json').write_text(
              json.dumps(result, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(result, indent=2, sort_keys=True))
          assert abs(ito - 6.916054) < 1e-6
          PY
      - name: Upload cost evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase1k-ito-cost-${{ github.sha }}
          path: phase1k-ito-cost.json
          if-no-files-found: error
          retention-days: 90
