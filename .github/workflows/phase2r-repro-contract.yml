name: Phase 2R Receipt Contract (NO TRAINING)

on:
  pull_request:
    paths:
      - "src/adversarial_sbox/phase2r_repro.py"
      - "tests/test_phase2r_repro.py"
      - "research/PHASE2R_REPRO_CONTROL_PROTOCOL.md"
      - ".github/workflows/phase2r-repro-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  receipt-contract-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install receipt validation tests only
        run: python -m pip install -e ".[dev]"
      - name: Test synthetic receipt validation only — NO SCIENTIFIC EXECUTION
        run: python -m pytest -q tests/test_phase2r_repro.py
