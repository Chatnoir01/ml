name: Phase 2V T8 metric-matched research
on:
  push:
    branches:
      - research/phase2v-t8-affine-matched-structure-20261119
  pull_request:
    paths:
      - "scripts/phase2v_t8_*"
      - "research/PHASE2V_T8_*"
      - ".github/workflows/phase2v-t8.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install repository without optional neural dependencies
        run: python -m pip install -e .
      - name: Twice reproduce full 1152-panel source and pin original SHA256
        shell: bash
        run: |
          set -euo pipefail
          python scripts/phase2v_t8_affine_matched.py --out "$RUNNER_TEMP/t8-a.json"
          python scripts/phase2v_t8_affine_matched.py --out "$RUNNER_TEMP/t8-b.json"
          cmp "$RUNNER_TEMP/t8-a.json" "$RUNNER_TEMP/t8-b.json"
          echo "3b119b704aa658070f286dff5b58dc4a5c0903fcf010d4bf22b119c64d1457f6  $RUNNER_TEMP/t8-a.json" | sha256sum --check
      - name: Audit independent cipher, metrics, every raw panel and group verdict
        shell: bash
        run: |
          set -euo pipefail
          python scripts/phase2v_t8_independent_audit.py --report "$RUNNER_TEMP/t8-a.json" --expected-sha 3b119b704aa658070f286dff5b58dc4a5c0903fcf010d4bf22b119c64d1457f6
      - name: Confirm fail-closed tampering negatives
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import copy,json,os
          from pathlib import Path
          from scripts.phase2v_t8_independent_audit import verify_shape,check_one_panel,audit
          original=json.loads((Path(os.environ["RUNNER_TEMP"])/"t8-a.json").read_text())
          tests=[
            ("missing panel",lambda d:d["panels"].pop(),verify_shape),
            ("duplicate panel",lambda d:d["panels"].append(copy.deepcopy(d["panels"][0])),verify_shape),
            ("altered AUC",lambda d:d["panels"][0].update(auc=0.999),lambda d:check_one_panel(d,d["panels"][0])),
            ("forged pair sha",lambda d:d["panels"][0].update(pairs_sha256="0"*64),lambda d:check_one_panel(d,d["panels"][0])),
            ("changed reference metric",lambda d:d["global_reference_metrics"].update(du=999),audit),
            ("changed primary verdict",lambda d:d["summary"].update(preregistered_directional_supported=False),audit),
          ]
          for name,mutator,guard in tests:
            corrupted=copy.deepcopy(original)
            mutator(corrupted)
            try:
              guard(corrupted)
            except (ValueError,AssertionError):
              print("PASS rejection:",name)
            else:
              raise AssertionError("accepted mutated report: "+name)
          PY
      - name: Preserve raw exact-source GitHub artifact temporarily
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: phase2v-t8-raw-1152-panels
          path: ${{ runner.temp }}/t8-a.json
          retention-days: 30
