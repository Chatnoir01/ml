[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adversarial-sbox"
version = "0.1.0"
description = "Reproducible research framework for evolutionary S-Box evaluation"
requires-python = ">=3.10"
dependencies = ["cryptography>=42.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]
neural = ["numpy>=2.0"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --disable-warnings"
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["adversarial_sbox*", "secure_core_mobile*"]
exclude = ["tests*"]
namespaces = false
